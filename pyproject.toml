[project]
name = "synapse-rag"
version = "0.1.0"
description = "Explainable GraphRAG: query-aware spreading activation over a Neo4j knowledge graph"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "neo4j>=5.25",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synapse_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs running Neo4j + Ollama with the demo graph loaded"]
# `pytest` runs the fast unit tests; `pytest -m live` runs the end-to-end scenarios.
addopts = ["-m", "not live"]

[tool.ruff]
line-length = 100
